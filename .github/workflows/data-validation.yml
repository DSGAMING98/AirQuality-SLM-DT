name: Data validation

on:
  push:
  pull_request:

jobs:
  verify-processed-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild processed splits
        run: python src/preprocess.py --csv data/raw/AirQualityUCI.csv --out data/processed
      - name: Run invariant tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m py_compile src/preprocess.py src/train.py src/evaluate.py app.py
